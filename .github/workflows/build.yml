name: Build Vigil Browser

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    name: Android (APK)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: dart run tool/setup.dart
      - run: flutter pub get
      - run: flutter test
      - name: Исправить плагин WebView под новый Android Gradle Plugin
        run: sed -i "s/proguard-android.txt/proguard-android-optimize.txt/g" ~/.pub-cache/hosted/pub.dev/flutter_inappwebview_android-*/android/build.gradle
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: VigilBrowser-android
          path: build/app/outputs/flutter-apk/app-release.apk
      - name: Выложить APK в Releases
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk VigilBrowser.apk
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest VigilBrowser.apk --target "$GITHUB_SHA" \
            --title "Vigil Browser (последняя сборка)" \
            --notes "Скачайте VigilBrowser.apk и установите на Android."
        env:
          GH_TOKEN: ${{ github.token }}

  ai-check:
    name: Проверка Vigil AI (бесплатный сервер)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Задать тестовый вопрос
        run: |
          curl -sS -m 90 -X POST https://text.pollinations.ai/openai \
            -H 'Content-Type: application/json' \
            -d '{"model":"openai","referrer":"foxbrowser","private":true,"messages":[{"role":"system","content":"Ты Vigil AI."},{"role":"user","content":"Привет! Кто ты и какая столица Франции? Ответь коротко."}]}' \
            -w '\nHTTP %{http_code}\n' | tail -c 1500
          echo "----- GET fallback -----"
          curl -sS -m 90 "https://text.pollinations.ai/$(python3 -c 'import urllib.parse;print(urllib.parse.quote("Сколько будет 2+2? Ответь одним числом."))')?model=openai&private=true&referrer=foxbrowser" \
            -w '\nHTTP %{http_code}\n' | tail -c 800

  windows:
    name: Windows (EXE)
    if: github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: dart run tool/setup.dart
      - run: flutter pub get
      - run: flutter build windows --release
      - uses: actions/upload-artifact@v4
        with:
          name: VigilBrowser-windows
          path: build/windows/x64/runner/Release/

  ios:
    name: iOS (без подписи)
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: dart run tool/setup.dart
      - run: flutter pub get
      - run: flutter build ios --release --no-codesign
      - name: Упаковать в .ipa
        run: |
          mkdir -p Payload
          cp -R build/ios/iphoneos/Runner.app Payload/
          zip -qr VigilBrowser-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: VigilBrowser-ios-unsigned
          path: VigilBrowser-unsigned.ipa
