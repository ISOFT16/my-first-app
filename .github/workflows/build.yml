name: Build Fox Browser

on:
  push:
  workflow_dispatch:

jobs:
  android:
    name: Android (APK)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: dart run tool/setup.dart
      - run: flutter pub get
      - run: flutter test
      - name: Исправить плагин WebView под новый Android Gradle Plugin
        run: sed -i "s/proguard-android.txt/proguard-android-optimize.txt/g" ~/.pub-cache/hosted/pub.dev/flutter_inappwebview_android-*/android/build.gradle
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: FoxBrowser-android
          path: build/app/outputs/flutter-apk/app-release.apk

  windows:
    name: Windows (EXE)
    if: github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: dart run tool/setup.dart
      - run: flutter pub get
      - run: flutter build windows --release
      - uses: actions/upload-artifact@v4
        with:
          name: FoxBrowser-windows
          path: build/windows/x64/runner/Release/

  ios:
    name: iOS (без подписи)
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: dart run tool/setup.dart
      - run: flutter pub get
      - run: flutter build ios --release --no-codesign
      - name: Упаковать в .ipa
        run: |
          mkdir -p Payload
          cp -R build/ios/iphoneos/Runner.app Payload/
          zip -qr FoxBrowser-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: FoxBrowser-ios-unsigned
          path: FoxBrowser-unsigned.ipa
