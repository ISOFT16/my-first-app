name: Build Night Heist game

on:
  push:
    paths:
      - 'game/**'
      - '.github/workflows/game.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    name: Android (APK)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'
      - name: Собрать APK
        run: VERSION_CODE="$GITHUB_RUN_NUMBER" game/android/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: NochnoyUgon-android
          path: game/android/out/NochnoyUgon.apk
      - name: Выложить APK в Releases
        run: |
          gh release delete game-latest --yes --cleanup-tag || true
          gh release create game-latest game/android/out/NochnoyUgon.apk --target "$GITHUB_SHA" \
            --title "Ночной Угон (последняя сборка)" --prerelease \
            --notes "Скачайте NochnoyUgon.apk и установите на Android."
        env:
          GH_TOKEN: ${{ github.token }}
